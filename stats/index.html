<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가격대별 세대수 통계 — 서울·경기·인천 아파트</title>
<meta name="description" content="서울·경기·인천 아파트 평형별 세대수를 최근가 기준 가격대와 연도별 가격 추이로 집계합니다.">
<meta property="og:type" content="website">
<meta property="og:title" content="가격대별 세대수 통계 — 서울·경기·인천 아파트">
<meta property="og:description" content="5억·10억·20억·30억·40억·50억 이상 가격대별 아파트 세대수 분포와 연도별 추세.">
<meta property="og:url" content="https://nodostream.com/stats/">
<meta property="og:locale" content="ko_KR">
<meta property="og:site_name" content="아파트 투자 스크리너">
<link rel="canonical" href="https://nodostream.com/stats/">
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>window.APT_BASE='../';</script>
<link rel="stylesheet" href="../css/main.css?v=20260808-tax-region2">
<link rel="stylesheet" href="../css/stats.css?v=20260808-tax-region2">
</head>
<body>
<div id="loading"><div class="sp"></div><span style="color:#94a3b8;font-size:13px" id="loadMsg">통계 로딩 중...</span></div>

<div id="app" class="stats-shell" style="display:none">
  <header class="stats-header">
    <div>
      <h1>가격대별 세대수 통계</h1>
      <p id="statsMeta">최근가 기준 가격대 분포 | 연도별 평균가 추세</p>
    </div>
    <nav class="stats-nav">
      <a href="../" class="pg-btn">아파트 스크리너</a>
      <a href="../compare/" class="pg-btn">지역 비교</a>
      <a href="../market/" class="pg-btn">시장 동향</a>
      <a href="../trades/" class="pg-btn">실거래가</a>
      <a href="../calc/" class="pg-btn">금융계산기</a>
    </nav>
  </header>

  <section class="stats-controls">
    <label>
      <span>지역</span>
      <select id="regionSelect" class="fi"></select>
    </label>
    <label>
      <span>시/구</span>
      <select id="guSelect" class="fi"></select>
    </label>
    <label>
      <span>동</span>
      <select id="dongSelect" class="fi"></select>
    </label>
    <label>
      <span>가격대</span>
      <select id="bucketSelect" class="fi"></select>
    </label>
    <label>
      <span>평형(평)</span>
      <div class="range-pair">
        <input id="areaMin" class="fi" type="number" placeholder="min">
        <input id="areaMax" class="fi" type="number" placeholder="max">
      </div>
    </label>
    <label>
      <span>단지 검색</span>
      <input id="searchInput" class="fi" type="text" placeholder="단지명, 구, 동">
    </label>
  </section>

  <section class="stats-kpis" id="kpis"></section>

  <main class="stats-grid">
    <section class="stats-panel span-2">
      <div class="panel-head">
        <h2>연도별 가격대 세대수 추이</h2>
        <span id="trendCaption"></span>
      </div>
      <div class="chart-box trend"><canvas id="trendChart"></canvas></div>
    </section>
    <section class="stats-panel">
      <div class="panel-head">
        <h2>현재 가격대 분포</h2>
        <span id="currentCaption"></span>
      </div>
      <div class="metric-toggle" role="group" aria-label="현재 분포 차트 기준">
        <button id="chartUnitsBtn" class="metric-btn active" type="button">세대수</button>
        <button id="chartCapBtn" class="metric-btn" type="button">시가총액</button>
      </div>
      <div class="chart-box current"><canvas id="currentChart"></canvas></div>
    </section>
    <section class="stats-panel">
      <div class="panel-head">
        <h2>가격대별 비중</h2>
        <span id="bucketCaption"></span>
      </div>
      <div class="table-wrap compact">
        <table>
          <thead id="bucketHead"></thead>
          <tbody id="bucketBody"></tbody>
        </table>
      </div>
    </section>
    <section class="stats-panel span-2">
      <div class="panel-head">
        <h2>하위 지역 비교</h2>
        <span id="childCaption"></span>
      </div>
      <div class="table-wrap compact">
        <table>
          <thead id="childHead"></thead>
          <tbody id="childBody"></tbody>
        </table>
      </div>
    </section>
    <section class="stats-panel span-2">
      <div class="panel-head">
        <h2>지역별 실제 주택분 종부세</h2>
        <span id="taxCaption"></span>
      </div>
      <div class="tax-layout">
        <div class="chart-box tax"><canvas id="taxChart"></canvas></div>
        <div class="table-wrap compact tax-table">
          <table>
            <thead>
              <tr>
                <th>지역</th><th>연도</th><th class="num">결정세액</th><th class="num">고지세액</th><th class="num">납세자</th><th class="num">전국비중</th><th>기준</th>
              </tr>
            </thead>
            <tbody id="taxBody"></tbody>
          </table>
        </div>
      </div>
      <p class="source-note" id="taxNote"></p>
    </section>
    <section class="stats-panel span-2">
      <div class="panel-head">
        <h2>평형별 단지 목록</h2>
        <span id="rowCaption"></span>
      </div>
      <div class="table-wrap rows">
        <table>
          <thead>
            <tr>
              <th>단지</th><th>지역</th><th>평형</th><th>최근가</th><th>세대수</th><th>추정 시총</th><th>구간</th><th>최근거래</th>
            </tr>
          </thead>
          <tbody id="rowBody"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script src="../js/stats-app.js?v=20260808-tax-region2"></script>
</body>
</html>
