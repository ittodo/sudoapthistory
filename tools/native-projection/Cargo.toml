[package]
name = "nodostream-projection-tests"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
ryu-js = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "cookies", "json"] }
chrono = "=0.4.45"
uuid = { version = "=1.26.1", features = ["v4"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib"] }

[build-dependencies]
sha2 = "0.10"
