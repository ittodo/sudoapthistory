name: Cloudflare Staging
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-staging
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.CLOUDFLARE_STAGING_ENABLED == 'true'
    environment: cloudflare-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run test:api
      - run: node --test tools/test-cloudflare-*.mjs tools/test-site-layout.mjs
      - run: node tools/verify-site-layout.mjs --ref "$GITHUB_SHA"
      - run: npm run build
      - name: Deploy existing staging DB schema only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --var RELEASE_SHA:$GITHUB_SHA
      - name: Verify staged release
        env:
          ORIGIN: ${{ vars.CLOUDFLARE_STAGING_ORIGIN }}
        run: node tools/verify-cloudflare-deployment.mjs "$ORIGIN" "$GITHUB_SHA" cloudflare/dist/public/deployment-manifest.json > cloudflare/dist/verified-release.json
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-staging-${{ github.sha }}
          path: |
            cloudflare/dist/public/deployment.json
            cloudflare/dist/public/deployment-manifest.json
            cloudflare/dist/verified-release.json
