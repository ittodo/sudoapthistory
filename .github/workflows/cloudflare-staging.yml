name: Cloudflare Staging
on:
  workflow_dispatch:
  push:
    branches: [cloudflare-staging]
permissions:
  contents: read
concurrency:
  group: cloudflare-staging
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/cloudflare-staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run test:api
      - run: node --test tools/test-cloudflare-*.mjs tools/test-site-layout.mjs
      - run: node tools/verify-site-layout.mjs --ref "$GITHUB_SHA"
      - run: npm run build
  deploy:
    needs: checks
    if: github.ref == 'refs/heads/cloudflare-staging'
    environment: cloudflare-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify explicitly enabled staging target
        env:
          CLOUDFLARE_STAGING_ENABLED: ${{ vars.CLOUDFLARE_STAGING_ENABLED }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_STAGING_ORIGIN: ${{ vars.CLOUDFLARE_STAGING_ORIGIN }}
        run: node tools/verify-cloudflare-staging.mjs
      - run: npm run build
      - name: Apply schema to staging D1 only (no data import)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply nodostream-staging --remote
      - name: Deploy free staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --var RELEASE_SHA:$GITHUB_SHA
      - name: Verify staged release
        env:
          ORIGIN: ${{ vars.CLOUDFLARE_STAGING_ORIGIN }}
        run: node tools/verify-cloudflare-deployment.mjs "$ORIGIN" "$GITHUB_SHA" cloudflare/dist/public/deployment-manifest.json > cloudflare/dist/verified-release.json
      - name: Verify Google login start without signing in
        run: node tools/verify-cloudflare-auth-start.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-staging-${{ github.sha }}
          path: |
            cloudflare/dist/public/deployment.json
            cloudflare/dist/public/deployment-manifest.json
            cloudflare/dist/verified-release.json
