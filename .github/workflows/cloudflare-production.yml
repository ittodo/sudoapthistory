name: Cloudflare Production
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.NODESTREAM_DEPLOYMENT_PROVIDER == 'cloudflare' && github.ref == 'refs/heads/main'
    environment: cloudflare-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Require committed cutover contract
        run: node -e "if(require('./tools/deployment-provider.json').provider!=='cloudflare')process.exit(1)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install tested Rust toolchain for native projection tests
        run: rustup toolchain install 1.92.0 --profile minimal && rustup override set 1.92.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/native-projection/target
          key: native-projection-${{ runner.os }}-1.92.0-${{ hashFiles('tools/native-projection/Cargo.lock', 'tools/native-projection/Cargo.toml', 'tools/native-projection/build.rs', 'tools/native-projection/src/**', 'tools/native-projection/vendor/**') }}
          restore-keys: native-projection-${{ runner.os }}-1.92.0-
      - run: npm run test:search
      - name: Verify explicitly approved production target and plan
        env:
          NODESTREAM_DEPLOYMENT_PROVIDER: ${{ vars.NODESTREAM_DEPLOYMENT_PROVIDER }}
          CLOUDFLARE_PRODUCTION_ENABLED: ${{ vars.CLOUDFLARE_PRODUCTION_ENABLED }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PRODUCTION_D1_ID: ${{ vars.CLOUDFLARE_PRODUCTION_D1_ID }}
          CLOUDFLARE_WORKERS_PLAN: ${{ vars.CLOUDFLARE_WORKERS_PLAN }}
          CLOUDFLARE_PAID_APPROVED: ${{ vars.CLOUDFLARE_PAID_APPROVED }}
          CLOUDFLARE_PRODUCTION_AUTH_APPROVED: ${{ vars.CLOUDFLARE_PRODUCTION_AUTH_APPROVED }}
          CLOUDFLARE_PRODUCTION_WRITES_APPROVED: ${{ vars.CLOUDFLARE_PRODUCTION_WRITES_APPROVED }}
        run: node tools/verify-cloudflare-production.mjs
      - run: npm run test:daily && node tools/test-map-model.cjs && node tools/test-map-parcels.cjs
      - run: npm run typecheck && npm run test:api
      - run: node --test tools/test-cloudflare-*.mjs tools/test-site-layout.mjs tools/test-apartment-data.mjs
      - run: node tools/verify-site-layout.mjs --ref "$GITHUB_SHA"
      - name: Reuse verified regional price bundles
        uses: actions/cache@v4
        with:
          path: cloudflare/dist/region-price-cache-v1
          key: region-prices-${{ runner.os }}-${{ github.sha }}
          restore-keys: region-prices-${{ runner.os }}-
      - run: npm run build
      - name: Ensure the explicitly approved board table only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PRODUCTION_D1_ID: ${{ vars.CLOUDFLARE_PRODUCTION_D1_ID }}
          CLOUDFLARE_PRODUCTION_WRITES_APPROVED: ${{ vars.CLOUDFLARE_PRODUCTION_WRITES_APPROVED }}
        run: node tools/ensure-cloudflare-board-schema.mjs
      - name: Ensure explicitly approved member library tables only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PRODUCTION_D1_ID: ${{ vars.CLOUDFLARE_PRODUCTION_D1_ID }}
          CLOUDFLARE_PRODUCTION_WRITES_APPROVED: ${{ vars.CLOUDFLARE_PRODUCTION_WRITES_APPROVED }}
        run: node tools/ensure-cloudflare-library-schema.mjs
      - name: Ensure explicitly approved admin audit table only
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PRODUCTION_D1_ID: ${{ vars.CLOUDFLARE_PRODUCTION_D1_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PRODUCTION_WRITES_APPROVED: ${{ vars.CLOUDFLARE_PRODUCTION_WRITES_APPROVED }}
        run: node tools/ensure-cloudflare-admin-schema.mjs
      - name: Ensure explicitly approved page analytics tables only
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PRODUCTION_D1_ID: ${{ vars.CLOUDFLARE_PRODUCTION_D1_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PRODUCTION_WRITES_APPROVED: ${{ vars.CLOUDFLARE_PRODUCTION_WRITES_APPROVED }}
        run: node tools/ensure-cloudflare-page-schema.mjs
      - name: Deploy without automatic schema migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production --var RELEASE_SHA:$GITHUB_SHA
      - name: Verify same SHA and public bytes
        run: node tools/verify-cloudflare-deployment.mjs https://nodostream.com "$GITHUB_SHA" cloudflare/dist/public/deployment-manifest.json > cloudflare/dist/verified-release.json
      - name: Verify production authentication remains available
        run: node tools/verify-cloudflare-auth-start.mjs --production
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-production-${{ github.sha }}
          path: |
            cloudflare/dist/public/deployment.json
            cloudflare/dist/public/deployment-manifest.json
            cloudflare/dist/verified-release.json
