name: Purge Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: cloudflare-purge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Wait for Pages deployment
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          node - <<'NODE'
          const token = process.env.GH_TOKEN;
          const repo = process.env.REPOSITORY;
          const sha = process.env.SHA;
          const deadline = Date.now() + 10 * 60 * 1000;
          let last = "";

          async function sleep(ms) {
            await new Promise((resolve) => setTimeout(resolve, ms));
          }

          while (Date.now() < deadline) {
            const res = await fetch(`https://api.github.com/repos/${repo}/actions/runs?per_page=50&head_sha=${sha}`, {
              headers: {
                Authorization: `Bearer ${token}`,
                Accept: "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28"
              }
            });
            if (!res.ok) {
              throw new Error(`GitHub Actions API failed: ${res.status} ${await res.text()}`);
            }

            const data = await res.json();
            const pages = data.workflow_runs.find((run) => run.name === "pages build and deployment");
            const message = pages ? `${pages.status}:${pages.conclusion || "pending"}` : "waiting for pages run";
            if (message !== last) {
              console.log(message);
              last = message;
            }

            if (pages?.status === "completed") {
              if (pages.conclusion === "success") {
                console.log(`Pages deployment completed for ${sha}.`);
                process.exit(0);
              }
              throw new Error(`Pages deployment finished with ${pages.conclusion}: ${pages.html_url}`);
            }

            await sleep(10000);
          }

          throw new Error(`Timed out waiting for Pages deployment for ${sha}.`);
          NODE

      - name: Purge Cloudflare cache
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          node - <<'NODE'
          const { execFileSync } = await import("node:child_process");
          const { readFileSync } = await import("node:fs");

          const zoneId = process.env.CF_ZONE_ID;
          const token = process.env.CF_API_TOKEN;
          if (!zoneId || !token) {
            throw new Error("Missing CF_ZONE_ID or CF_API_TOKEN GitHub secret.");
          }

          function git(args) {
            return execFileSync("git", args, { encoding: "utf8" }).trim();
          }

          let changed = [];
          try {
            git(["rev-parse", "--verify", "HEAD^"]);
            changed = git(["diff", "--name-only", "HEAD^", "HEAD"]).split(/\r?\n/).filter(Boolean);
          } catch {
            changed = git(["ls-tree", "-r", "--name-only", "HEAD"]).split(/\r?\n/).filter(Boolean);
          }

          const html = readFileSync("index.html", "utf8");
          const version = html.match(/main-app\.js\?v=([^"']+)/)?.[1];
          const files = new Set([
            "https://nodostream.com/",
            "https://nodostream.com/index.html",
            "https://nodostream.com/compare/",
            "https://nodostream.com/compare/index.html",
            "https://nodostream.com/data/market.json",
            "https://nodostream.com/market/",
            "https://nodostream.com/market/index.html"
          ]);

          for (const path of changed) {
            if (
              path.startsWith(".") ||
              path.startsWith("tools/") ||
              path.startsWith("schemas/") ||
              path.startsWith("docs/")
            ) {
              continue;
            }
            files.add(`https://nodostream.com/${path}`);
          }

          if (version) {
            files.add(`https://nodostream.com/js/main-app.js?v=${version}`);
            files.add(`https://nodostream.com/js/polygen-packed-index-loader.js?v=${version}`);
            files.add(`https://nodostream.com/js/polygen-index-loader.js?v=${version}`);
          }

          const urls = [...files].sort();
          const endpoint = `https://api.cloudflare.com/client/v4/zones/${zoneId}/purge_cache`;

          if (urls.length > 90) {
            const res = await fetch(endpoint, {
              method: "POST",
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({ purge_everything: true })
            });
            const body = await res.text();
            if (res.status === 401) throw new Error("Cloudflare 401: refresh CF_API_TOKEN.");
            if (!res.ok) throw new Error(`Cloudflare purge_everything failed: ${res.status} ${body}`);
            console.log("Purged Cloudflare with purge_everything=true.");
            process.exit(0);
          }

          for (let i = 0; i < urls.length; i += 30) {
            const chunk = urls.slice(i, i + 30);
            const res = await fetch(endpoint, {
              method: "POST",
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({ files: chunk })
            });
            const body = await res.text();
            if (res.status === 401) throw new Error("Cloudflare 401: refresh CF_API_TOKEN.");
            if (!res.ok) throw new Error(`Cloudflare file purge failed: ${res.status} ${body}`);
          }

          console.log(`Purged ${urls.length} Cloudflare URLs.`);
          for (const url of urls) console.log(url);
          NODE
