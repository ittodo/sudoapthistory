name: Cloudflare Prepare Production (no public routes)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cloudflare-prepare-production.yml']
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && vars.NODESTREAM_DEPLOYMENT_PROVIDER != 'cloudflare'
    environment: cloudflare-production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: 665f3ebbb6062c9cf65282a54f1c04b58704fd08
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PRODUCTION_D1_ID: ${{ vars.CLOUDFLARE_PRODUCTION_D1_ID }}
      CLOUDFLARE_WORKERS_PLAN: ${{ vars.CLOUDFLARE_WORKERS_PLAN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 665f3ebbb6062c9cf65282a54f1c04b58704fd08
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reject any public access or non-approved target
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),process.env.SOURCE_SHA);
          const c=JSON.parse(readFileSync('wrangler.jsonc','utf8')), p=c.env.production;
          assert.equal(process.env.CLOUDFLARE_ACCOUNT_ID,'90ef0cc5b9fc89e9005b5ca905ae2b6e');
          assert.equal(process.env.CLOUDFLARE_PRODUCTION_D1_ID,'ca03a96c-acb0-4a10-8615-503df3dc5b74');
          assert.equal(process.env.CLOUDFLARE_WORKERS_PLAN,'free');
          assert.equal(p.name,'nodostream');
          assert.equal(p.workers_dev,false); assert.equal(p.preview_urls,false);
          assert.equal(p.vars.AUTH_ENABLED,'false'); assert.equal(p.vars.MAINTENANCE,'true');
          assert.equal(p.vars.SITE_ORIGIN,'https://nodostream.com'); assert.equal(p.limits,undefined);
          assert.equal(c.route,undefined); assert.equal(p.route,undefined);
          assert.equal(c.routes?.length??0,0); assert.equal(p.routes?.length??0,0);
          assert.deepEqual(p.d1_databases,[{binding:'DB',database_name:'nodostream-production',database_id:process.env.CLOUDFLARE_PRODUCTION_D1_ID,migrations_dir:'cloudflare/migrations'}]);
          assert.equal(JSON.parse(readFileSync('tools/deployment-provider.json','utf8')).provider,'github-pages');
          NODE
      - run: npm ci
      - run: npm run typecheck && npm run test:api
      - run: node --test tools/test-cloudflare-*.mjs tools/test-site-layout.mjs
      - run: GITHUB_SHA="$SOURCE_SHA" npm run build
      - name: Require initialized empty production DB before upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const tables=['users','profiles','sessions','oauth_states','comments','comment_likes','tags','stock_tags','tag_votes','rate_limits'];
          const sql='SELECT (SELECT version FROM schema_metadata) AS schema_version,'+tables.map(t=>`(SELECT count(*) FROM ${t}) AS ${t}`).join(',');
          const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/d1/database/${process.env.CLOUDFLARE_PRODUCTION_D1_ID}/query`,{method:'POST',headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'Content-Type':'application/json'},body:JSON.stringify({sql})});
          assert.equal(r.ok,true,`D1 verification HTTP ${r.status}`);
          const j=await r.json(); assert.equal(j.success,true); const row=j.result[0].results[0];
          assert.equal(row.schema_version,1); for(const t of tables) assert.equal(row[t],0,`Production ${t} must be empty`);
          const scripts=await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts`,{headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`}});
          assert.equal(scripts.ok,true,`Worker inventory HTTP ${scripts.status}`);
          const inventory=await scripts.json(); assert.equal(inventory.success,true);
          assert.equal(inventory.result.some(s=>s.id==='nodostream'),true,'Expected prepared Worker missing');
          const activeResponse=await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/nodostream/deployments`,{headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`}});
          assert.equal(activeResponse.ok,true); const active=await activeResponse.json(); assert.equal(active.success,true);
          assert.deepEqual(active.result.deployments[0].versions,[{version_id:'b450cf28-05bc-4991-97d7-b43c8765160a',percentage:100}],'Only the just-created preparation version may be replaced');
          console.log('Schema 1, all user tables empty. No migrations or data writes performed.');
          NODE
      - name: Upload Worker and assets without public routes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --env production --var RELEASE_SHA:$SOURCE_SHA
      - name: Verify workers.dev and preview URLs disabled
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {writeFileSync,readFileSync} from 'node:fs';
          const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/nodostream/subdomain`,{headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`}});
          assert.equal(r.ok,true,`Worker verification HTTP ${r.status}`);
          const j=await r.json(); assert.equal(j.success,true);
          assert.equal(j.result.enabled,false); assert.equal(j.result.previews_enabled,false);
          const release=JSON.parse(readFileSync('cloudflare/dist/public/deployment.json','utf8'));
          assert.equal(release.gitSha,process.env.SOURCE_SHA);
          writeFileSync('cloudflare/dist/prepared-production.json',JSON.stringify({sourceSha:process.env.SOURCE_SHA,workersDev:false,previewUrls:false,schemaVersion:1,publicCutover:false,release},null,2));
          console.log('Production upload prepared. Public addresses disabled; DNS and billing unchanged.');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-production-preparation-${{ github.run_id }}
          path: |
            cloudflare/dist/prepared-production.json
            cloudflare/dist/public/deployment.json
            cloudflare/dist/public/deployment-manifest.json
