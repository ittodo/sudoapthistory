name: Verify redevelopment data

on:
  push:
    paths:
      - "data/index.json"
      - "data/building-status.json"
      - "data/redevelopment-decisions.json"
      - "data/redevelopment-evidence.json"
      - "data/redevelopment-relations.json"
      - "data/redevelopment-review-queue.json"
      - "tools/verify-redevelopment-data.mjs"
      - "tools/test-redevelopment-model.mjs"
      - ".github/workflows/verify-redevelopment.yml"
  pull_request:
    paths:
      - "data/index.json"
      - "data/building-status.json"
      - "data/redevelopment-decisions.json"
      - "data/redevelopment-evidence.json"
      - "data/redevelopment-relations.json"
      - "data/redevelopment-review-queue.json"
      - "tools/verify-redevelopment-data.mjs"
      - "tools/test-redevelopment-model.mjs"
      - ".github/workflows/verify-redevelopment.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/verify-redevelopment-data.mjs
      - run: node tools/test-redevelopment-model.mjs
